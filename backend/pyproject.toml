[project]
name = "slove-context"
version = "0.0.0"
description = "Local monolith (node 3.2). Health/version, audit logs, Story Project / Spec, Canon, Snapshot, Scene Card APIs, Fake LLM Gateway."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "jsonschema>=4.18.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["slove_context*"]

[tool.setuptools.package-data]
slove_context = ["llm/fixtures/*.json"]

[tool.ruff]
target-version = "py311"
src = ["."]

[tool.mypy]
python_version = "3.11"
pretty = true
